<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengelolaan Bisnis</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#f5f5f5;
    }

    .container{
      width:95%;
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    h1{
      margin-bottom:20px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .card h3{
      margin-bottom:10px;
    }

    .card p{
      font-size:24px;
      font-weight:bold;
    }

    .form-box,
    .produk-box{
      background:white;
      margin-top:20px;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:1px solid #ddd;
      border-radius:8px;
    }

    button{
      padding:10px 15px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      color:white;
      margin:3px;
    }

    .tambah-btn{
      background:#16a34a;
      width:100%;
      margin-top:15px;
    }

    .jual-btn{
      background:#2563eb;
    }

    .hapus-btn{
      background:#dc2626;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    table th,
    table td{
      border-bottom:1px solid #ddd;
      padding:12px;
      text-align:center;
    }

    @media(max-width:768px){

      table{
        font-size:12px;
      }

      .card p{
        font-size:20px;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <h1>Dashboard Bisnis</h1>

    <div class="stats">

      <div class="card">
        <h3>Modal</h3>
        <p id="modal">Rp 0</p>
      </div>

      <div class="card">
        <h3>Pendapatan</h3>
        <p id="pendapatan">Rp 0</p>
      </div>

      <div class="card">
        <h3>Untung</h3>
        <p id="untung">Rp 0</p>
      </div>

      <div class="card">
        <h3>Rugi</h3>
        <p id="rugi">Rp 0</p>
      </div>

    </div>

    <div class="form-box">

      <h2>Tambah Produk</h2>

      <input type="text" id="nama" placeholder="Nama Produk">

      <input type="number" id="beli" placeholder="Harga Beli">

      <input type="number" id="jual" placeholder="Harga Jual">

      <input type="number" id="stok" placeholder="Stok">

      <button class="tambah-btn" onclick="tambahProduk()">
        Simpan Produk
      </button>

    </div>

    <div class="produk-box">

      <h2>Daftar Produk</h2>

      <table>

        <thead>
          <tr>
            <th>Produk</th>
            <th>Beli</th>
            <th>Jual</th>
            <th>Stok</th>
            <th>Terjual</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="produkList"></tbody>

      </table>

    </div>

  </div>

  <script>

    let produk =
      JSON.parse(localStorage.getItem("produk")) || [];

    function simpanData(){
      localStorage.setItem(
        "produk",
        JSON.stringify(produk)
      );
    }

    function formatRupiah(angka){
      return angka.toLocaleString("id-ID");
    }

    function tambahProduk(){

      const nama =
        document.getElementById("nama").value;

      const beli =
        Number(document.getElementById("beli").value);

      const jual =
        Number(document.getElementById("jual").value);

      const stok =
        Number(document.getElementById("stok").value);

      if(!nama || !beli || !jual || !stok){
        alert("Lengkapi data");
        return;
      }

      produk.push({
        nama,
        beli,
        jual,
        stok,
        terjual:0
      });

      simpanData();

      tampilkanProduk();

      document.getElementById("nama").value = "";
      document.getElementById("beli").value = "";
      document.getElementById("jual").value = "";
      document.getElementById("stok").value = "";
    }

    function jualProduk(index){

      const jumlah =
        prompt("Masukkan jumlah terjual:");

      if(jumlah === null) return;

      const qty = Number(jumlah);

      if(isNaN(qty) || qty <= 0){
        alert("Jumlah tidak valid");
        return;
      }

      if(qty > produk[index].stok){
        alert("Stok tidak cukup");
        return;
      }

      produk[index].stok -= qty;

      produk[index].terjual += qty;

      simpanData();

      tampilkanProduk();

      alert("Penjualan berhasil");
    }

    function hapusProduk(index){

      const yakin =
        confirm("Hapus produk ini?");

      if(yakin){

        produk.splice(index,1);

        simpanData();

        tampilkanProduk();
      }
    }

    function tampilkanProduk(){

      const list =
        document.getElementById("produkList");

      let html = "";

      let modal = 0;
      let pendapatan = 0;
      let untung = 0;
      let rugi = 0;

      produk.forEach((item,index)=>{

        modal +=
          item.beli *
          (item.stok + item.terjual);

        pendapatan +=
          item.jual * item.terjual;

        const profit =
          (item.jual - item.beli) *
          item.terjual;

        if(profit >= 0){
          untung += profit;
        }else{
          rugi += Math.abs(profit);
        }

        html += `
          <tr>

            <td>${item.nama}</td>

            <td>
              Rp ${formatRupiah(item.beli)}
            </td>

            <td>
              Rp ${formatRupiah(item.jual)}
            </td>

            <td>${item.stok}</td>

            <td>${item.terjual}</td>

            <td>

              <button
                class="jual-btn"
                onclick="jualProduk(${index})">

                Jual

              </button>

              <button
                class="hapus-btn"
                onclick="hapusProduk(${index})">

                Hapus

              </button>

            </td>

          </tr>
        `;
      });

      list.innerHTML = html;

      document.getElementById("modal").innerText =
        "Rp " + formatRupiah(modal);

      document.getElementById("pendapatan").innerText =
        "Rp " + formatRupiah(pendapatan);

      document.getElementById("untung").innerText =
        "Rp " + formatRupiah(untung);

      document.getElementById("rugi").innerText =
        "Rp " + formatRupiah(rugi);
    }

    tampilkanProduk();

  </script>

</body>
</html>
